name: Publish Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to augment with a Windows installer
        required: true

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Verify release version and destination
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag does not match the product version' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Create the matching Release before adding installers' }
      - run: npm ci
      - run: npm run check:regression
      - run: npm run desktop:build
      - name: Verify installed editing, recovery and reinstallation
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          ./script/check_windows_install.ps1 -Installer $installers[0].FullName
          node scripts/writeArtifactChecksums.mjs $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare installer checksums' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laniakea-windows-release-runtime
          path: ${{ runner.temp }}/laniakea-runtime/*
          if-no-files-found: ignore
      - name: Add verified installer and checksums to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          gh release upload $env:RELEASE_TAG $installer "$installer.sha256" "$installer.build.json" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the installer; existing assets were not replaced' }
